<!doctype html>
<html>
<head><meta charset="utf-8"><title>shot</title></head>
<body style="margin:0;overflow:hidden">
<iframe id="f" src="/" style="width:100%;height:100vh;border:0;display:block"></iframe>
<script>
  var map = { services: ['.services-section', 70], footer: ['.site-footer', 0], reviews: ['.reviews-section', 80], card: ['.service-grid', 120] };
  document.getElementById('f').addEventListener('load', function () {
    var w = this.contentWindow;
    var key = (location.hash || '#services').slice(1);
    var cfg = map[key] || map.services;
    w.document.documentElement.style.scrollBehavior = 'auto';
    w.document.documentElement.classList.remove('reveal');
    w.document.querySelectorAll('[data-reveal]').forEach(function (n) { n.classList.add('is-in'); });
    var el = w.document.querySelector(cfg[0]);
    if (!el) return;
    w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - cfg[1]);
  });
</script>
</body>
</html>
